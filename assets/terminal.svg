<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="760" height="244" viewBox="0 0 760 244" role="img" aria-label="envella reporting three invalid environment variables at once, with the secret masked">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
    .p { fill: #7ee787; } .c { fill: #e6edf3; } .r { fill: #ff7b72; } .k { fill: #e6edf3; font-weight: 600; } .d { fill: #8b949e; } .y { fill: #f2cc60; }
  </style>
  <rect width="760" height="244" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="759" height="243" rx="11.5" fill="none" stroke="#30363d"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/><circle cx="44" cy="22" r="6" fill="#febc2e"/><circle cx="64" cy="22" r="6" fill="#28c840"/>
  <text x="24" y="70"><tspan class="p">$</tspan><tspan class="c" x="40">npx envella check env.schema.ts</tspan></text>
  <text x="24" y="104" class="r">Invalid environment variables:</text>
  <text x="24" y="132"><tspan class="r" x="40">x</tspan><tspan class="k" x="62">DATABASE_URL</tspan><tspan class="d" x="200">missing, expected url (Postgres connection string)</tspan></text>
  <text x="24" y="158"><tspan class="r" x="40">x</tspan><tspan class="k" x="62">PORT</tspan><tspan class="y" x="200">"abc"</tspan><tspan class="d"> is invalid: expected a port (1-65535)</tspan></text>
  <text x="24" y="184"><tspan class="r" x="40">x</tspan><tspan class="k" x="62">STRIPE_KEY</tspan><tspan class="y" x="200">****</tspan><tspan class="d"> is invalid: expected string</tspan></text>
  <text x="24" y="218"><tspan class="p">$</tspan></text>
</svg>
